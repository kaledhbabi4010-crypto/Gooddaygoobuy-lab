name: GOODDAY220 — WINDOWS REAL LAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # WINDOWS FORENSIC MATRIX
  # Each probe is independent and therefore can execute in parallel.
  # ---------------------------------------------------------------------------

  forensic:
    name: Windows forensic — ${{ matrix.probe }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        probe:
          - environment
          - autodesk
          - goodday
          - integrity

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "GOODDAY220 WINDOWS REAL LAB" | Out-File evidence/header.txt

      # -----------------------------------------------------------------------
      # ENVIRONMENT
      # -----------------------------------------------------------------------

      - name: Environment probe
        if: matrix.probe == 'environment'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          systeminfo |
            Out-File evidence/systeminfo.txt

          Get-CimInstance Win32_OperatingSystem |
            Format-List * |
            Out-File evidence/os.txt

          Get-Command python -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File evidence/python-command.txt

          python --version 2>&1 |
            Out-File evidence/python-version.txt

          git --version 2>&1 |
            Out-File evidence/git-version.txt

          dotnet --info 2>&1 |
            Out-File evidence/dotnet-info.txt

          msbuild -version 2>&1 |
            Out-File evidence/msbuild.txt

          Get-Command msbuild -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File evidence/msbuild-command.txt

          Get-Process |
            Sort-Object ProcessName |
            Out-File evidence/process-list.txt

      # -----------------------------------------------------------------------
      # AUTODESK
      # -----------------------------------------------------------------------

      - name: Autodesk forensic probe
        if: matrix.probe == 'autodesk'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $roots = @(
            "$env:ProgramFiles\Autodesk",
            "$env:ProgramFiles(x86)\Autodesk",
            "$env:ProgramData\Autodesk",
            "$env:LOCALAPPDATA\Autodesk",
            "$env:APPDATA\Autodesk"
          )

          New-Item -ItemType Directory -Force -Path evidence\autodesk | Out-Null

          $roots |
            Out-File evidence\autodesk\roots.txt

          Get-Process acad -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File evidence\autodesk\acad-process.txt

          Get-Process Revit -ErrorAction SilentlyContinue |
            Format-List * |
            Out-File evidence\autodesk\revit-process.txt

          $acad = @()
          $revit = @()

          foreach ($root in $roots) {
            if (Test-Path $root) {
              try {
                $acad += Get-ChildItem `
                  -Path $root `
                  -Filter acad.exe `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue
              } catch {}

              try {
                $revit += Get-ChildItem `
                  -Path $root `
                  -Filter Revit.exe `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue
              } catch {}
            }
          }

          $acad = $acad | Sort-Object FullName -Unique
          $revit = $revit | Sort-Object FullName -Unique

          $acad |
            Select-Object FullName,Length,LastWriteTime |
            ConvertTo-Json -Depth 5 |
            Out-File evidence\autodesk\acad-files.json

          $revit |
            Select-Object FullName,Length,LastWriteTime |
            ConvertTo-Json -Depth 5 |
            Out-File evidence\autodesk\revit-files.json

          foreach ($f in $acad) {
            Get-AuthenticodeSignature $f.FullName |
              Select-Object Path,Status,StatusMessage,SignerCertificate |
              Format-List * |
              Out-File evidence\autodesk\acad-signature.txt -Append

            Get-FileHash $f.FullName -Algorithm SHA256 |
              Format-List * |
              Out-File evidence\autodesk\acad-sha256.txt -Append

            (Get-Item $f.FullName).VersionInfo |
              Format-List * |
              Out-File evidence\autodesk\acad-version.txt -Append
          }

          foreach ($f in $revit) {
            Get-AuthenticodeSignature $f.FullName |
              Select-Object Path,Status,StatusMessage,SignerCertificate |
              Format-List * |
              Out-File evidence\autodesk\revit-signature.txt -Append

            Get-FileHash $f.FullName -Algorithm SHA256 |
              Format-List * |
              Out-File evidence\autodesk\revit-sha256.txt -Append

            (Get-Item $f.FullName).VersionInfo |
              Format-List * |
              Out-File evidence\autodesk\revit-version.txt -Append
          }

          $uninstall = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          foreach ($key in $uninstall) {
            Get-ItemProperty $key -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DisplayName -match "AutoCAD|Revit|Autodesk"
              } |
              Select-Object DisplayName,DisplayVersion,Publisher,InstallLocation,UninstallString |
              Format-List * |
              Out-File evidence\autodesk\installed-software.txt -Append
          }

          Get-Service -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "Adsk|Autodesk" -or
              $_.DisplayName -match "Autodesk"
            } |
            Format-List * |
            Out-File evidence\autodesk\services.txt

          $decision = [ordered]@{
            acad_exe_found = [bool]($acad.Count -gt 0)
            revit_exe_found = [bool]($revit.Count -gt 0)
            acad_process = [bool]((Get-Process acad -ErrorAction SilentlyContinue))
            revit_process = [bool]((Get-Process Revit -ErrorAction SilentlyContinue))
            evidence_type = "real Windows filesystem/process/registry/signature evidence"
            download_source_proven = $false
            license_bypass_used = $false
          }

          $decision |
            ConvertTo-Json -Depth 10 |
            Out-File evidence\autodesk\decision.json

      # -----------------------------------------------------------------------
      # GOODDAY
      # -----------------------------------------------------------------------

      - name: Goodday forensic probe
        if: matrix.probe == 'goodday'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          New-Item -ItemType Directory -Force -Path evidence\goodday | Out-Null

          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\' -and
              $_.FullName -notmatch '\\.github\\'
            } |
            Select-Object FullName,Length,LastWriteTime |
            ConvertTo-Json -Depth 10 |
            Out-File evidence\goodday\files.json

          python --version 2>&1 |
            Out-File evidence\goodday\python.txt

          python -m compileall -q . 2>&1 |
            Out-File evidence\goodday\compileall.txt

          $compileCode = $LASTEXITCODE

          python -m pytest --collect-only -q 2>&1 |
            Out-File evidence\goodday\pytest-collect.txt

          $pytestCollectCode = $LASTEXITCODE

          python -m pytest -q 2>&1 |
            Out-File evidence\goodday\pytest.txt

          $pytestCode = $LASTEXITCODE

          $pyFiles = Get-ChildItem -Recurse -Filter *.py -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\' -and
              $_.FullName -notmatch '__pycache__'
            }

          $syntax = @()

          foreach ($file in $pyFiles) {
            python -m py_compile "$($file.FullName)" 2>&1 |
              Out-File evidence\goodday\pycompile.txt -Append

            $code = $LASTEXITCODE

            $syntax += [ordered]@{
              file = $file.FullName
              compile_exit = $code
              status = if ($code -eq 0) { "PASS" } else { "FAIL" }
            }
          }

          $syntax |
            ConvertTo-Json -Depth 10 |
            Out-File evidence\goodday\syntax.json

          $summary = [ordered]@{
            compileall_exit = $compileCode
            pytest_collect_exit = $pytestCollectCode
            pytest_exit = $pytestCode
            python_files = $pyFiles.Count
            syntax_failures = @(
              $syntax |
              Where-Object { $_.status -eq "FAIL" }
            ).Count
          }

          $summary |
            ConvertTo-Json -Depth 10 |
            Out-File evidence\goodday\summary.json

      # -----------------------------------------------------------------------
      # INTEGRITY
      # -----------------------------------------------------------------------

      - name: Integrity probe
        if: matrix.probe == 'integrity'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          New-Item -ItemType Directory -Force -Path evidence\integrity | Out-Null

          git status --short |
            Out-File evidence\integrity\git-status.txt

          git rev-parse HEAD |
            Out-File evidence\integrity\head.txt

          git ls-files |
            Out-File evidence\integrity\tracked-files.txt

          git diff --check |
            Out-File evidence\integrity\diff-check.txt

          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\'
            } |
            ForEach-Object {
              try {
                Get-FileHash $_.FullName -Algorithm SHA256
              } catch {}
            } |
            Export-Csv evidence\integrity\sha256.csv -NoTypeInformation

      # -----------------------------------------------------------------------
      # UPLOAD
      # -----------------------------------------------------------------------

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOODDAY220-${{ matrix.probe }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # AGGREGATE
  # ---------------------------------------------------------------------------

  aggregate:
    name: Aggregate real evidence
    if: always()
    needs: forensic
    runs-on: windows-2022

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all evidence
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Build aggregate report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final-evidence | Out-Null

          Get-ChildItem -Recurse -File collected |
            Select-Object FullName,Length,LastWriteTime |
            ConvertTo-Json -Depth 10 |
            Out-File final-evidence/artifacts.json

          $autodesk = Get-ChildItem `
            -Path collected `
            -Filter decision.json `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($autodesk) {
            $autodesk |
              Get-Content |
              Out-File final-evidence/autodesk-decision.txt
          }

          $summaries = Get-ChildItem `
            -Path collected `
            -Filter summary.json `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($summaries) {
            $summaries |
              Get-Content |
              Out-File final-evidence/goodday-summary.txt
          }

          @"
          GOODDAY220 REAL LAB RESULT
          ==========================
          This report contains evidence collected from Windows.
          Missing executable/process evidence is NOT interpreted as installation.
          Digital signature does NOT prove original download URL.
          No license bypass was used.
          "@ |
            Out-File final-evidence/README.txt

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOODDAY220-FINAL-${{ github.run_id }}
          path: final-evidence
          if-no-files-found: warn
